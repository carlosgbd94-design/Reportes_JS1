<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Restablecer Contraseña — SIREVAQ MÓVIL</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:FILL@0..1" rel="stylesheet">
  <link rel="stylesheet" href="tailwind_compiled.css">
  <link rel="stylesheet" href="mobile_style.css?v=2026.2">
  <style>
    body, html, input, button, p, div, span:not(.material-symbols-rounded) {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col justify-center items-center p-6 relative overflow-hidden">

  <!-- 🌌 Glass Container Card -->
  <div class="w-full max-w-sm rounded-[32px] border border-slate-200 bg-white/70 backdrop-blur-2xl p-8 shadow-xl relative z-10 text-center">
    
    <!-- Logo -->
    <div class="w-20 h-20 mx-auto mb-6 bg-white rounded-3xl flex items-center justify-center shadow-md border border-slate-200/80">
      <img src="https://raw.githubusercontent.com/carlosgbd94-design/Logos/refs/heads/main/logo_nuevo.png" class="h-12 w-auto" alt="Logo JS1">
    </div>

    <!-- Title -->
    <h1 class="text-xl font-black tracking-tight text-slate-900 mb-1">
      Nueva Contraseña
    </h1>
    <p class="text-xs font-bold text-slate-500 mb-8">
      Actualiza tus credenciales de acceso seguro
    </p>

    <!-- Form -->
    <form id="resetForm" class="space-y-6">
      <div class="login-input-wrap">
        <span class="material-symbols-rounded login-icon">lock</span>
        <input type="password" id="pwdNew" required placeholder="Contraseña Nueva" class="login-input">
      </div>

      <div class="login-input-wrap">
        <span class="material-symbols-rounded login-icon">lock_reset</span>
        <input type="password" id="pwdConfirm" required placeholder="Confirmar Contraseña" class="login-input">
      </div>

      <button type="submit" class="login-btn">
        Actualizar Seguridad
      </button>
    </form>

    <div class="mt-6">
      <a href="mobile.html" class="text-xs font-black text-slate-500 hover:text-slate-900 transition-colors uppercase tracking-widest">
        Regresar al Login
      </button>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="fixed top-6 left-6 right-6 z-[99999] flex flex-col gap-3 pointer-events-none"></div>

  <!-- Overlay de Procesando -->
  <div id="overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[9999] hidden flex-col items-center justify-center gap-4 text-white">
    <div class="w-10 h-10 border-4 border-white/20 border-t-white rounded-full animate-spin"></div>
    <span class="text-sm font-bold tracking-wider uppercase" id="overlayText">Guardando...</span>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://utclfqjietlxzlorxhrs.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV0Y2xmcWppZXRseHpsb3J4aHJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNTYyNTQsImV4cCI6MjA5MTkzMjI1NH0.EgDK7xkSZHZyUlGF5m2C7bZjrfkx1M8cBXzxIFedDa4"; 
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const showToast = (message, type = 'success') => {
        const container = document.getElementById('toastContainer');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = `toast-msg ${type}`;
        toast.innerHTML = `
            <span class="material-symbols-rounded text-lg">${type === 'success' ? 'check_circle' : 'error'}</span>
            <span>${message}</span>
        `;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(-10px)';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    };

    function getParam(name) {
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      if (hashParams.has(name)) return hashParams.get(name);
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has(name)) return urlParams.get(name);
      return null;
    }

    // Canvas Background
    const canvas = document.createElement('canvas');
    canvas.style.position = 'fixed';
    canvas.style.top = '0';
    canvas.style.left = '0';
    canvas.style.width = '100vw';
    canvas.style.height = '100vh';
    canvas.style.zIndex = '-2';
    canvas.style.pointerEvents = 'none';
    canvas.style.opacity = '0.35';
    document.body.appendChild(canvas);

    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    });

    const particles = [];
    for (let i = 0; i < 20; i++) {
        particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.4,
            vy: (Math.random() - 0.5) * 0.4,
            r: Math.random() * 2 + 1
        });
    }

    const animate = () => {
        ctx.clearRect(0, 0, width, height);
        ctx.strokeStyle = 'rgba(15, 23, 42, 0.06)';
        ctx.fillStyle = 'rgba(15, 23, 42, 0.1)';

        particles.forEach((p, idx) => {
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0 || p.x > width) p.vx *= -1;
            if (p.y < 0 || p.y > height) p.vy *= -1;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();

            for (let j = idx + 1; j < particles.length; j++) {
                const p2 = particles[j];
                const dx = p.x - p2.x;
                const dy = p.y - p2.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 110) {
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }
            }
        });
        requestAnimationFrame(animate);
    };
    animate();

    // Submit Action
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pwdNew = document.getElementById('pwdNew').value.trim();
      const pwdConfirm = document.getElementById('pwdConfirm').value.trim();

      if (pwdNew.length < 6) {
        showToast("La contraseña debe tener al menos 6 caracteres", "error");
        return;
      }
      if (pwdNew !== pwdConfirm) {
        showToast("Las contraseñas no coinciden", "error");
        return;
      }

      const overlay = document.getElementById('overlay');
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');

      try {
        const { data: { user }, error: updateError } = await supabaseClient.auth.updateUser({
          password: pwdNew,
          data: { force_password_change: false }
        });

        if (updateError) throw updateError;

        if (user) {
          await supabaseClient.from('perfiles').update({ must_change: false }).eq('id', user.id);
          const { data: legacyUser } = await supabaseClient.from('usuarios_legacy').select('usuario').eq('email', user.email).maybeSingle();
          if (legacyUser && legacyUser.usuario) {
            await supabaseClient.from('usuarios_legacy').update({ must_change: false }).eq('usuario', legacyUser.usuario);
          }
        }

        showToast("Contraseña restablecida con éxito.");
        setTimeout(() => {
          window.location.href = "mobile.html";
        }, 2000);
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
      }
    });
  </script>
</body>
</html>
