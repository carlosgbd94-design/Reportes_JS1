<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioVac — Vista de impresión</title>
<script defer src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script defer src="biovac_assets.js"></script>
<script defer src="biovac_print_ui.js"></script>
<style>
  :root { --borde: #000; --rojo: #c00000; --gris: #555; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: "Arial Nova", Arial, sans-serif; color: #000; background: #ececec; font-size: 11px; }

  .barra-control {
    display: flex; gap: 10px; align-items: center; margin-bottom: 14px;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .barra-control select, .barra-control input {
    padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px;
  }
  .barra-control button {
    padding: 7px 16px; border: none; border-radius: 6px; background: #003366; color: #fff;
    font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .barra-control button:hover { background: #002548; }

  .hoja { background: #fff; width: 297mm; min-height: 210mm; margin: 0 auto 16px; padding: 6mm 8mm; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
  .hoja + .hoja { page-break-before: always; }

  table.form { width: 100%; border-collapse: collapse; }
  table.form td, table.form th { border: 1px solid var(--borde); padding: 2px 4px; vertical-align: middle; }

  .encabezado-logo { display: flex; align-items: center; gap: 10px; border: none !important; }
  .encabezado-logo img { height: 42px; }
  .titulo-principal { text-align: center; font-weight: 700; font-size: 12px; }

  .campo-etiqueta { font-weight: 700; font-size: 10px; white-space: nowrap; }

  table.datos { width: 100%; border-collapse: collapse; margin-top: 4px; }
  table.datos th, table.datos td { border: 1px solid var(--borde); padding: 1px 3px; font-size: 9.5px; text-align: center; }
  table.datos th { background: #f2f2f2; font-weight: 700; }
  table.datos td.nombre-bio { text-align: left; font-weight: 700; font-size: 9px; }
  table.datos tr.fila-arf { background: #fff8e6; }
  .tag-arf-print { color: var(--rojo); font-weight: 700; }
  table.datos tr.fila-total td { font-weight: 700; background: #f2f2f2; }
  td.obs { text-align: left; font-size: 8.5px; }

  @media print {
    body { background: #fff; padding: 0; }
    .barra-control { display: none; }
    .hoja { box-shadow: none; margin: 0; width: auto; min-height: 0; }
    @page { size: landscape; margin: 5mm; }
  }
</style>
</head>
<body>

<div class="barra-control">
  <select id="selUnidad"></select>
  <select id="selAnio"></select>
  <select id="selMes"></select>
  <button id="btnCargar">Cargar</button>
  <button id="btnImprimir">Imprimir / Guardar PDF</button>
</div>

<div id="contenedorHojas"></div>

</body>
</html>
