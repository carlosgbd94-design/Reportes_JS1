<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIREVAQ — Loadscreen Híbrida Oficial (Opción 1 + Opción 2)</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --bg-primary: #090d16;
            --card-bg: #0f172a;
            --accent-blue: #0284c7;
            --accent-sky: #38bdf8;
            --accent-emerald: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* BARRA SUPERIOR DE CONTROL */
        .gallery-header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .gallery-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .gallery-title h1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gallery-badge {
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.2), rgba(16, 185, 129, 0.2));
            color: var(--accent-sky);
            border: 1px solid rgba(56, 189, 248, 0.4);
            font-size: 11px;
            font-weight: 900;
            padding: 4px 12px;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .gallery-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-action {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            border: none;
            padding: 10px 22px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.5);
        }

        /* ÁREA DE DEMOSTRACIÓN PRINCIPAL */
        .stage-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #090d16 100%);
            position: relative;
        }

        /* ==========================================================================
           LOADSCREEN HÍBRIDA OFICIAL (OPCIÓN 1 + OPCIÓN 2)
           ========================================================================== */
        .ls-hybrid-backdrop {
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .ls-hybrid-card {
            background: #ffffff;
            color: #0f172a;
            width: 100%;
            max-width: 480px;
            border-radius: 28px;
            padding: 38px 32px 32px 32px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.15);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: hybridPopIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes hybridPopIn {
            0% { opacity: 0; transform: scale(0.96) translateY(12px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* BARRA SUPERIOR DE GRADIENTE DE ACENTO (DE OPCIÓN 1) */
        .ls-hybrid-accent-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #0084d4 0%, #0284c7 45%, #38bdf8 75%, #10b981 100%);
        }

        /* ANILLO SVG MICRO-GAUGE ALREDEDOR DEL LOGO (DE OPCIÓN 2) */
        .ls-hybrid-ring-wrapper {
            position: relative;
            width: 108px;
            height: 108px;
            margin: 0 auto 18px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ls-hybrid-svg {
            transform: rotate(-90deg);
            width: 108px;
            height: 108px;
        }

        .ls-hybrid-svg-bg {
            stroke: #f1f5f9;
            stroke-width: 7;
        }

        .ls-hybrid-svg-bar {
            stroke: #0284c7;
            stroke-width: 7;
            stroke-dasharray: 283;
            stroke-dashoffset: 99; /* 65% */
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes pulseHybridLogo {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 4px 8px rgba(0, 132, 212, 0.25)); }
            50% { transform: scale(1.05); filter: filter: drop-shadow(0 8px 16px rgba(0, 132, 212, 0.4)); }
        }

        .ls-hybrid-logo-inner {
            position: absolute;
            width: 52px;
            height: auto;
            animation: pulseHybridLogo 2.2s ease-in-out infinite;
        }

        /* BADGE PROCESO (OPCIÓN 1) */
        .ls-hybrid-badge {
            display: inline-block;
            background: #e0f2fe;
            color: #0369a1;
            border: 1px solid #bae6fd;
            font-size: 11px;
            font-weight: 900;
            padding: 4px 14px;
            border-radius: 9999px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(2, 132, 199, 0.08);
        }

        /* TÍTULO Y MENSAJE */
        .ls-hybrid-title {
            margin: 0 0 6px 0;
            font-size: 21px;
            font-weight: 900;
            color: #0f172a;
            letter-spacing: -0.02em;
            line-height: 1.25;
        }

        .ls-hybrid-msg {
            margin: 0 0 22px 0;
            font-size: 13px;
            font-weight: 700;
            color: #475569;
            min-height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.45;
        }

        /* BARRA DE PROGRESO DE ALTA PRECISIÓN (OPCIÓN 1) */
        .ls-hybrid-progress-bg {
            background: #f1f5f9;
            border-radius: 9999px;
            height: 13px;
            width: 100%;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            position: relative;
            margin-bottom: 12px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
        }

        .ls-hybrid-progress-bar {
            background: linear-gradient(90deg, #0084d4 0%, #0284c7 50%, #38bdf8 100%);
            height: 100%;
            width: 65%;
            border-radius: 9999px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
        }

        /* DETALLES DE PIE DE TARJETA */
        .ls-hybrid-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11.5px;
            font-weight: 800;
            color: #64748b;
        }

        .ls-hybrid-pct {
            color: #0284c7;
            font-weight: 900;
            letter-spacing: 0.02em;
        }

    </style>
</head>
<body>

    <!-- BARRA DE CONTROL DE GALERÍA -->
    <div class="gallery-header">
        <div class="gallery-title">
            <h1>SIREVAQ — Design System</h1>
            <span class="gallery-badge">⭐ Loadscreen Híbrida Oficial (1 + 2)</span>
        </div>
        <div class="gallery-controls">
            <button class="btn-action" onclick="toggleSimulateProgress()">
                <span class="material-symbols-rounded">play_arrow</span> Simular Progreso Dinámico (0% -> 100%)
            </button>
        </div>
    </div>

    <!-- ÁREA DE PREVISUALIZACIÓN -->
    <div class="stage-container">
        <div class="ls-hybrid-backdrop">
            <div class="ls-hybrid-card">
                <!-- ACCENT GRADIENT TOP BAR (OPCIÓN 1) -->
                <div class="ls-hybrid-accent-bar"></div>

                <!-- CIRCULAR GAUGE RING WITH PULSING LOGO (OPCIÓN 2) -->
                <div class="ls-hybrid-ring-wrapper">
                    <svg class="ls-hybrid-svg" viewBox="0 0 100 100">
                        <circle class="ls-hybrid-svg-bg" cx="50" cy="50" r="45" fill="none"></circle>
                        <circle id="hybridGaugeRing" class="ls-hybrid-svg-bar" cx="50" cy="50" r="45" fill="none"></circle>
                    </svg>
                    <img src="https://raw.githubusercontent.com/carlosgbd94-design/Logos/refs/heads/main/logo_nuevo.png" class="ls-hybrid-logo-inner" alt="Logo SIREVAQ">
                </div>

                <!-- PROCESS BADGE (OPCIÓN 1) -->
                <div id="hybridBadge" class="ls-hybrid-badge">
                    EXPORTACIÓN MASIVA PDF
                </div>

                <!-- TITLE & CURRENT SUBTITLE (COMBINADO 1 + 2) -->
                <h3 id="hybridTitle" class="ls-hybrid-title">
                    Generando Reportes (<span id="hybridPctVal">65</span>%)
                </h3>
                <p id="hybridMsg" class="ls-hybrid-msg">
                    [13/20] Centro de Salud Querétaro — Unidades Médicas
                </p>

                <!-- HIGH PRECISION PROGRESS BAR (OPCIÓN 1) -->
                <div class="ls-hybrid-progress-bg">
                    <div id="hybridProgressBar" class="ls-hybrid-progress-bar" style="width: 65%;"></div>
                </div>

                <!-- FOOTER COUNTER & PCT STATUS -->
                <div class="ls-hybrid-footer">
                    <span id="hybridStepCount">13 de 20 Unidades</span>
                    <span id="hybridPctText" class="ls-hybrid-pct">65% COMPLETADO</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let simInterval = null;

        function updateProgress(pct) {
            // Actualizar texto e identificadores
            document.getElementById('hybridPctVal').textContent = pct;
            document.getElementById('hybridPctText').textContent = `${pct}% COMPLETADO`;
            document.getElementById('hybridTitle').textContent = `Generando Reportes (${pct}%)`;

            // Actualizar barra horizontal (Opción 1)
            document.getElementById('hybridProgressBar').style.width = `${pct}%`;

            // Actualizar anillo SVG circular (Opción 2)
            const ring = document.getElementById('hybridGaugeRing');
            if (ring) {
                const strokeDashoffset = 283 - (283 * pct / 100);
                ring.style.strokeDashoffset = strokeDashoffset;
            }

            // Cambiar mensaje dinámico según progreso
            const msgEl = document.getElementById('hybridMsg');
            const stepEl = document.getElementById('hybridStepCount');
            const total = 20;
            const current = Math.min(total, Math.ceil((pct / 100) * total));
            
            stepEl.textContent = `${current} de ${total} Unidades`;
            msgEl.textContent = `[${current}/${total}] Procesando Unidad Médica de Salud...`;
        }

        function toggleSimulateProgress() {
            if (simInterval) {
                clearInterval(simInterval);
                simInterval = null;
                return;
            }

            let p = 0;
            simInterval = setInterval(() => {
                p += 2;
                if (p > 100) p = 0;
                updateProgress(p);
            }, 70);
        }
    </script>
</body>
</html>
