<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplos de Botones - Vista en Vivo</title>
    <!-- Importar Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root {
            --primary: #003366; /* Color de tu app */
            --bg-color: #f8fafc;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px;
            color: #1e293b;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: var(--primary);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
        }

        .material-symbols-rounded {
            font-size: 20px;
            font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
        }

        /* =========================================
           ESTILOS DE LOS BOTONES
           ========================================= */

        /* 1. Suave (Soft Tint) */
        .btn-1 {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 51, 102, 0.08);
            color: var(--primary);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-1:hover {
            background: rgba(0, 51, 102, 0.15);
            transform: scale(1.05);
        }

        /* 2. Sombra Flotante (Floating Shadow) */
        .btn-2 {
            width: 38px; height: 38px;
            border-radius: 50%;
            border: none;
            background: white;
            color: var(--primary);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 51, 102, 0.15);
        }
        .btn-2:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 51, 102, 0.2);
            color: #0055ff;
        }

        /* 3. Contorno Sólido (Outline) */
        .btn-3 {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            background: transparent;
            color: var(--primary);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-3:hover {
            background: var(--primary);
            color: white;
        }

        /* 4. Sólido Primario (Solid) */
        .btn-4 {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .btn-4:hover {
            background: #004080;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transform: scale(1.05);
        }

        /* 5. Minimalista Expandible (Pill on Hover) */
        .btn-5 {
            height: 36px; width: 36px;
            border-radius: 18px;
            border: none;
            background: #f1f5f9;
            color: #475569;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            padding: 0;
        }
        .btn-5 .text {
            max-width: 0;
            opacity: 0;
            white-space: nowrap;
            transition: all 0.3s ease;
            font-weight: 700;
            font-size: 13px;
        }
        .btn-5:hover {
            width: 80px;
            background: var(--primary);
            color: white;
        }
        .btn-5:hover .text {
            max-width: 50px;
            opacity: 1;
            margin-left: 4px;
        }

        /* 6. Neumorfismo (Neumorphism) */
        .btn-6 {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--bg-color);
            color: var(--primary);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 5px 5px 10px #d1d5db, -5px -5px 10px #ffffff;
        }
        .btn-6:hover {
            box-shadow: inset 5px 5px 10px #d1d5db, inset -5px -5px 10px #ffffff;
            transform: scale(0.98);
        }

        /* 7. Cuadrado Redondeado (Squircle) */
        .btn-7 {
            width: 36px; height: 36px;
            border-radius: 10px;
            border: none;
            background: rgba(0, 51, 102, 0.08);
            color: var(--primary);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-7:hover {
            background: rgba(0, 51, 102, 0.15);
            transform: rotate(5deg) scale(1.05);
        }

        /* 8. Gradiente (Gradient Glow) */
        .btn-8 {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #0055ff, #003366);
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 85, 255, 0.3);
        }
        .btn-8:hover {
            box-shadow: 0 6px 15px rgba(0, 85, 255, 0.4);
            transform: translateY(-2px);
        }

        /* 9. Minimalista Borde Delgado (Thin Outline) */
        .btn-9 {
            width: 34px; height: 34px;
            border-radius: 50%;
            border: 1px solid #cbd5e1;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-9:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(0, 51, 102, 0.05);
        }

        /* 10. Oscuro Elegante (Dark Mode) */
        .btn-10 {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: none;
            background: #1e293b;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-10:hover {
            background: #0f172a;
            color: white;
        }
    </style>
</head>
<body>

    <h1>10 Diseños para el Botón "Live View"</h1>

    <div class="grid">
        <!-- Tarjeta 1 -->
        <div class="card">
            <span class="card-title">1. Suave (Fondo translúcido)</span>
            <button class="btn-1"><span class="material-symbols-rounded">visibility</span></button>
        </div>

        <!-- Tarjeta 2 -->
        <div class="card">
            <span class="card-title">2. Sombra Flotante</span>
            <button class="btn-2"><span class="material-symbols-rounded">visibility</span></button>
        </div>

        <!-- Tarjeta 3 -->
        <div class="card">
            <span class="card-title">3. Contorno Sólido</span>
            <button class="btn-3"><span class="material-symbols-rounded">visibility</span></button>
        </div>

        <!-- Tarjeta 4 -->
        <div class="card">
            <span class="card-title">4. Sólido Primario</span>
            <button class="btn-4"><span class="material-symbols-rounded">visibility</span></button>
        </div>

        <!-- Tarjeta 5 -->
        <div class="card">
            <span class="card-title">5. Pill Expandible</span>
            <button class="btn-5">
                <span class="material-symbols-rounded">visibility</span>
                <span class="text">Ver</span>
            </button>
        </div>

        <!-- Tarjeta 6 -->
        <div class="card" style="background-color: var(--bg-color);">
            <span class="card-title">6. Neumorfismo</span>
            <button class="btn-6"><span class="material-symbols-rounded">visibility</span></button>
        </div>

        <!-- Tarjeta 7 -->
        <div class="card">
            <span class="card-title">7. Cuadrado Redondeado</span>
            <button class="btn-7"><span class="material-symbols-rounded">visibility</span></button>
        </div>

        <!-- Tarjeta 8 -->
        <div class="card">
            <span class="card-title">8. Gradiente</span>
            <button class="btn-8"><span class="material-symbols-rounded">visibility</span></button>
        </div>

        <!-- Tarjeta 9 -->
        <div class="card">
            <span class="card-title">9. Minimalista (Borde)</span>
            <button class="btn-9"><span class="material-symbols-rounded">visibility</span></button>
        </div>

        <!-- Tarjeta 10 -->
        <div class="card">
            <span class="card-title">10. Oscuro Elegante</span>
            <button class="btn-10"><span class="material-symbols-rounded">visibility</span></button>
        </div>
    </div>

</body>
</html>
