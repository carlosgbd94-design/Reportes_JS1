<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SINBA - Captura de Información de Salud</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Excel Grid styles (reconstructed) -->
  <link rel="stylesheet" href="excel_styles.css">
  <!-- Premium UI styles -->
  <link rel="stylesheet" href="custom_styles.css">
  
  <!-- Supabase & SheetJS CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

  <!-- Loading State Overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div style="text-align: center;">
      <div class="spinner"></div>
      <p style="margin-top: 12px; font-weight: 600; font-size: 14px; color: #1e293b;" id="loadingText">Cargando base de datos...</p>
    </div>
  </div>

  <!-- Header Section with metadata controls -->
  <header>
    <div class="header-top">
      <h1>SISTEMA DE CAPTURA SINBA 2026</h1>
      <div style="display: flex; gap: 12px; align-items: center;">
        <span class="status-pill success" id="connectionStatus">Conectado a Base de Datos</span>
        <span class="status-pill danger" id="templateStatus" style="cursor: pointer;">Plantilla: Cargar Archivo</span>
        <input type="file" id="inputTemplateFile" style="display: none;" accept=".xlsx" />
      </div>
    </div>
    
    <div class="header-controls">
      <div class="control-group">
        <label for="selectMuni">Municipio</label>
        <select id="selectMuni">
          <option value="">Selecciona Municipio...</option>
        </select>
      </div>
      
      <div class="control-group">
        <label for="selectUnidad">Unidad de Salud</label>
        <select id="selectUnidad" disabled>
          <option value="">Selecciona Unidad...</option>
        </select>
      </div>
      
      <div class="control-group">
        <label for="inputCLUE">CLUES</label>
        <input type="text" id="inputCLUE" readonly style="background-color: #0f172a; border-color: #1e293b;" />
      </div>
      
      <div class="control-group">
        <label for="inputJurisdiccion">Jurisdicción</label>
        <input type="text" id="inputJurisdiccion" readonly style="background-color: #0f172a; border-color: #1e293b;" />
      </div>
      
      <div class="control-group">
        <label for="selectMes">Mes a Reportar</label>
        <select id="selectMes">
          <option value="ENERO">ENERO</option>
          <option value="FEBRERO">FEBRERO</option>
          <option value="MARZO">MARZO</option>
          <option value="ABRIL">ABRIL</option>
          <option value="MAYO">MAYO</option>
          <option value="JUNIO">JUNIO</option>
          <option value="JULIO">JULIO</option>
          <option value="AGOSTO">AGOSTO</option>
          <option value="SEPTIEMBRE" selected>SEPTIEMBRE</option>
          <option value="OCTUBRE">OCTUBRE</option>
          <option value="NOVIEMBRE">NOVIEMBRE</option>
          <option value="DICIEMBRE">DICIEMBRE</option>
        </select>
      </div>

      <div class="control-group">
        <label for="selectAnio">Año</label>
        <select id="selectAnio">
          <option value="2026" selected>2026</option>
          <option value="2027">2027</option>
          <option value="2028">2028</option>
        </select>
      </div>

      <div class="control-group" style="grid-column: span 2;">
        <label for="inputResponsable">Responsable de Elaboración</label>
        <input type="text" id="inputResponsable" placeholder="Escribe el nombre completo..." value="" />
      </div>
    </div>
  </header>

  <!-- Sheet Tab Navigation -->
  <nav class="tabs-nav">
    <button class="tab-btn active" data-tab="SINBA-SIS-06-P">SINBA-SIS-06-P (Aplicación)</button>
    <button class="tab-btn" data-tab="MOV-DE-BIOLÓGICO">MOV-DE-BIOLÓGICO (Movimientos)</button>
    <button class="tab-btn" data-tab="SIS-SS-CE-H-2026">SIS-SS-CE-H-2026 (Concentrado)</button>
    <button class="tab-btn" data-tab="SIS-SS-IE Mensual">SIS-SS-IE Mensual (Influenza)</button>
  </nav>

  <!-- Main Grid Workspace & Sidebar -->
  <div class="main-layout">
    <!-- Main grid viewport -->
    <div class="grid-wrapper" id="gridWrapper">
      <!-- Grid templates injected here -->
    </div>
    
    <!-- Sidebar action panel -->
    <div class="sidebar">
      <div class="sidebar-section">
        <h3>Acciones Principales</h3>
        <button class="sidebar-btn" id="btnExport" style="margin-bottom: 12px;">
          <svg style="width: 18px; height: 18px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          Exportar a Excel (.xlsx)
        </button>
      </div>
      
      <div class="sidebar-section" style="flex: 1; overflow-y: auto;">
        <h3>Validaciones de Lotes</h3>
        <div id="validationList" style="display: flex; flex-direction: column; gap: 8px;">
          <div class="status-pill" style="width: 100%; justify-content: center; background-color: #f8fafc;">Ingrese datos para validar...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Templates and scripts -->
  <script src="grids_templates.js"></script>
  <script src="datos_lookups.js"></script>
  <script src="dependencies.js"></script>
  <script src="main.js"></script>
</body>
</html>
